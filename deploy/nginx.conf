# nginx site for PANTS. provision.sh installs this to /etc/nginx/sites-available/pants,
# then `certbot --nginx` adds the TLS block and the port-80 redirect.

server {
    server_name pants.mdeller.com;

    # No uploads: PANTS serves a precomputed catalogue. Keep the body small so a stray
    # POST is rejected by nginx rather than occupying a gunicorn worker.
    client_max_body_size 1m;

    # 100 MB of predicted structures live here and never change once written, so nginx
    # serves them from disk and gunicorn is never held open for the duration of a
    # multi-megabyte PDB transfer.
    location /static/ {
        alias /opt/pants/app/static/;

        # Shared snippet: the immutable long-cache header, and the comment explaining why
        # `access_log off;` must NOT be added here. mdeller.com counts a hit for this app
        # by watching for a request only a rendering browser makes; with logging off that
        # traffic is invisible and the count reads zero forever with nothing to show why.
        include /etc/nginx/snippets/long-cache.conf;

        # nginx's stock mime.types maps .pdb to `application/x-pilot` -- the PalmPilot
        # database format -- and .cif to nothing in particular. That is not a cosmetic
        # problem: it silently defeated `gzip_types`, because the type being produced was
        # not the type being matched, and 100 MB of highly compressible text went out
        # uncompressed with no error anywhere.
        #
        # Declared here rather than in the shared /etc/nginx/mime.types, which BoltzMaker
        # and FlexAppeal also serve structures through; editing that file would change
        # their behaviour too. This location serves only these four extensions.
        types {
            text/css         css;
            text/javascript  js;
            text/plain       pdb cif;
        }
        default_type text/plain;

        # Structure files are plain text and compress by roughly 75%.
        gzip on;
        gzip_types text/plain text/css text/javascript;
        gzip_min_length 1024;
    }

    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 80;
    listen [::]:80;
}
